<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .tv-container {
            display: flex;
            width: 95vw;
            height: 90vh;
            gap: 18px;
        }

        .left-panel {
            display: flex;
            flex-direction: column;
            width: 35%;
            gap: 19px;
        }

        .right-panel {
            display: flex;
            flex-direction: column;
            width: 65%;
            gap: 18px;
        }

        .box {
            background-color: #ffffff;
            border: 6px solid #cbd5e1;
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.25);
        }
        .box-title {
            color: #1e293b;
            font-size: 2.2vw;
            font-weight: bold;
            text-transform: uppercase;
            text-shadow: 1px 1px 2px rgba(30, 41, 59, 0.4);
            margin-bottom: 12px;
        }
        /* Painel esquerdo - local (guiche ou consultório) */
        .local-box { flex: 1; }
        .local-number{
            color: #dc2626;
            font-size: 9vw;
            font-weight: bold;
            line-height: 1;
        }
        .local-type{
            color: #64748b;
            font-size: 1.8vw;
            font-weight: bold;
            margin-top: 6px;
        }
        /* Histórico */
        .history-box{
            flex: 1;
            justify-content: flex-start;
            align-items: flex-start;
        }
        .history-box .box-title{
            font-size: 1.8vw; align-self: center;}
        #history-list {
            list-style: none;
            width: 100%;
            color: #dc2626;
            font-size: 1.5vw;
            font-weight: bold;
            text-align: left;
        }
        #history-list li {
            margin-bottom: 8px;
            border-bottom: 1px solid rgba(203, 213, 225, 0.8);
            padding-bottom: 5px;
        }
        /* Painel direito - nome do paciente */
        .patient-box { flex: 3; }
        .patient-name {
            color: #dc2626;
            font-size: 6.5vw;
            font-weight: bold;
            line-height: 1.2;
            word-break: break-word;
        }

        /* Logo  */
        .logo-box { flex: 1; }
        .logo-text {
            color: #2563eb;
            font-size: 3.5vw;
            font-weight: bold;
            text-transform: uppercase;
        }
        /* Animação de flash quando chama */
        @keyframes flash {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .flash { animation: flash 0.5s ease 3; }
    </style>
    <title>Midia Indoor - TV</title>

</head>

<body>
  <!-- Estrutura da tela TV corrigida -->
  <div class="tv-container">
    <div class="left-panel">
      <div class="box local-box">
        <div class="box-title" id="local-tipo">GUICHÊ</div>
        <div class="local-number" id="local-numero">--</div>
      </div>

      <div class="box history-box">
        <div class="box-title">ÚLTIMAS CHAMADAS</div>
        <ul id="history-list"></ul>
      </div>
    </div>
    <div class="right-panel">
      <div class="box patient-box">
        <div class="box-title">PACIENTE</div>
        <div class="patient-name" id="patient-name">AGUARDANDO...</div>
      </div>
      <div class="box logo-box">
        <div class="logo-text">🏥 Sistema Hospitalar</div>
      </div>
    </div>
  </div>

  <script>
    let ultimoId = null;

    function atualizar() {
      fetch("http://localhost:3000/tv/chamada")
        .then(r => r.json())
        .then(data => {
          const chamada = data.chamada;
          const historico = data.historico || [];

          if (chamada) {
            document.getElementById("local-tipo").innerText = chamada.localTipo || "GUICHÊ";
            document.getElementById("local-numero").innerText = chamada.localNumero || "--";
            document.getElementById("patient-name").innerText = chamada.paciente || "AGUARDANDO...";

            // Flash visual quando há chamada nova
            if (chamada.id !== ultimoId) {
              ultimoId = chamada.id;
              const patientBox = document.querySelector(".patient-box");
              patientBox.classList.remove("flash");
              void patientBox.offsetWidth; // reflow
              patientBox.classList.add("flash");
            }
          }

          // Histórico
          const list = document.getElementById("history-list");
          list.innerHTML = "";
          historico.slice(0, 4).forEach(h => {
            const li = document.createElement("li");
            const tipo = h.localTipo ? h.localTipo.substring(0, 4) : "GUIC";
            li.innerText = `${tipo} ${h.localNumero} - ${h.paciente}`;
            list.appendChild(li);
          });
        })
        .catch(err => console.log("Erro ao buscar chamada:", err));
    }

    // Atualiza a cada 2 segundos
    atualizar();
    setInterval(atualizar, 2000);
  </script>
</body>

</html>
