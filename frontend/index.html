<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Hospital Aura</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="container">
    <div class="logo-container">
      <img src="logo.png" alt="Logo Hospital Aura" class="logo">
    </div>

    <h2>Hospital Aura</h2>
    
    <input id="usuario" placeholder="Usuário">
    <input id="senha" type="password" placeholder="Senha">
    <button onclick="login()">Entrar</button>
  </div>

  <script>
    function login() {
      fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          usuario: usuario.value,
          senha: senha.value
        })
      })
        .then(r => r.json())
        .then(data => {
          if (data.tipo === "triagem") location.href = "triagem.html";
          if (data.tipo === "medico") location.href = "medico.html";
          if (data.tipo === "atendimento") location.href = "atendimento.html";
        });
    }
  </script>
</body>

</html>
